name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Show project structure
      - name: Find Android project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          echo ""
          echo "Searching for Gradle wrapper..."

          GRADLEW_PATH=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Searching for Gradle files:"
            find . -maxdepth 5 -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" -o \
              -name "build.gradle" -o \
              -name "build.gradle.kts" \
            \) -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          echo "Gradle wrapper found at:"
          echo "$GRADLEW_PATH"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 4. Make Gradle executable
      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found in project directory."
            exit 1
          fi

          chmod +x ./gradlew

      # 5. Clean project
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew clean

      # 6. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      # 7. Find generated APK
      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Searching for APK..."

          find . -type f -name "*.apk" -print

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCablePro-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 9. Build summary
      - name: Build completed
        run: |
          echo "======================================"
          echo "        MyCable Pro APK READY"
          echo "======================================"
          echo "APK artifact: MyCablePro-Debug-APK"
