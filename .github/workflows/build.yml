name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MyCablePro_Full_Updated_Project

    steps:

      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout project
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # -----------------------------
      # 3. Setup Gradle
      # -----------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # -----------------------------
      # 4. Check project
      # -----------------------------
      - name: Check Android project
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "App files:"
          ls -la app

          echo ""
          echo "Gradle version:"
          gradle --version

      # -----------------------------
      # 5. Build Debug APK
      # -----------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          gradle clean assembleDebug --stacktrace

      # -----------------------------
      # 6. Find APK
      # -----------------------------
      - name: Find generated APK
        shell: bash
        run: |
          echo "Searching for APK files..."
          find app/build/outputs -type f -name "*.apk" -print

      # -----------------------------
      # 7. Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCablePro-Debug-APK
          path: MyCablePro_Full_Updated_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # -----------------------------
      # 8. Success message
      # -----------------------------
      - name: Build completed
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       MYCABLE PRO APK READY"
          echo "======================================"
          echo ""
          echo "APK successfully generated."
